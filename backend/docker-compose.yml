services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobibenin
      POSTGRES_PASSWORD: mobibenin
      POSTGRES_DB: mobibenin
    ports:
      - "5432:5432"
    volumes:
      - mobibenin_pg_data:/var/lib/postgresql/data

volumes:
  mobibenin_pg_data:
